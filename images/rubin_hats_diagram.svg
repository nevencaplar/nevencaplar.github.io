<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c26a1b"/></marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- legend -->
  <rect x="20" y="14" width="18" height="18" rx="4" fill="#e6f4ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="46" y="29" font-size="19" fill="#333">available</text>
  <rect x="150" y="14" width="18" height="18" rx="4" fill="#fbeedf" stroke="#c26a1b" stroke-width="2"/>
  <text x="176" y="29" font-size="19" fill="#333">in progress</text>

  <!-- left: available -->
  <rect x="20" y="60" width="250" height="150" rx="12" fill="#e6f4ec" stroke="#2e8b57" stroke-width="3"/>
  <text x="145" y="102" font-size="24" font-weight="bold" fill="#1d5e3a" text-anchor="middle">Data previews</text>
  <text x="145" y="136" font-size="20" fill="#333" text-anchor="middle">DP1 and DP2 catalogs</text>
  <text x="145" y="164" font-size="20" fill="#333" text-anchor="middle">with light curves</text>

  <rect x="20" y="250" width="250" height="160" rx="12" fill="#e6f4ec" stroke="#2e8b57" stroke-width="3"/>
  <text x="145" y="292" font-size="24" font-weight="bold" fill="#1d5e3a" text-anchor="middle">Alerts</text>
  <text x="145" y="326" font-size="20" fill="#333" text-anchor="middle">public alert archive +</text>
  <text x="145" y="354" font-size="20" fill="#333" text-anchor="middle">live crossmatch of</text>
  <text x="145" y="382" font-size="20" fill="#333" text-anchor="middle">the alert stream</text>

  <!-- right: in progress -->
  <rect x="530" y="60" width="250" height="150" rx="12" fill="#fbeedf" stroke="#c26a1b" stroke-width="3"/>
  <text x="655" y="102" font-size="24" font-weight="bold" fill="#8a4a10" text-anchor="middle">Prompt Products</text>
  <text x="655" y="136" font-size="20" fill="#333" text-anchor="middle">database in HATS,</text>
  <text x="655" y="164" font-size="20" fill="#333" text-anchor="middle">for bulk analysis</text>

  <rect x="530" y="250" width="250" height="160" rx="12" fill="#fbeedf" stroke="#c26a1b" stroke-width="3"/>
  <text x="655" y="292" font-size="24" font-weight="bold" fill="#8a4a10" text-anchor="middle">Light curves</text>
  <text x="655" y="326" font-size="20" fill="#333" text-anchor="middle">from prompt processing,</text>
  <text x="655" y="354" font-size="20" fill="#333" text-anchor="middle">assembled per object</text>

  <!-- center -->
  <rect x="310" y="175" width="180" height="110" rx="14" fill="#1f2a36"/>
  <circle cx="400" cy="205" r="13" fill="#ffffff"/>
  <path d="M376,236 Q400,214 424,236 Z" fill="#ffffff"/>
  <text x="400" y="266" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">Rubin users</text>

  <!-- arrows -->
  <path d="M272,150 C295,165 300,190 306,205" fill="none" stroke="#2e8b57" stroke-width="5" marker-end="url(#a-green)"/>
  <path d="M272,320 C295,300 300,275 306,258" fill="none" stroke="#2e8b57" stroke-width="5" marker-end="url(#a-green)"/>
  <path d="M528,150 C505,165 500,190 494,205" fill="none" stroke="#c26a1b" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#a-orange)"/>
  <path d="M528,320 C505,300 500,275 494,258" fill="none" stroke="#c26a1b" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#a-orange)"/>

  <text x="400" y="320" font-size="18" fill="#555" text-anchor="middle">all in HATS,</text>
  <text x="400" y="344" font-size="18" fill="#555" text-anchor="middle">analyzed with LSDB</text>
</svg>
